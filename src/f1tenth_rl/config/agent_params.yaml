rl_agent:
  ros__parameters:
    # Training parameters
    training_mode: true       # Set to false for deployment/testing
    model_type: 'dqn'         # Options: 'dqn', 'ppo' (when implemented)
    model_path: ''            # Path to saved model (empty for training from scratch)
    save_path: 'models/'      # Directory to save trained models
    
    # Environment parameters
    max_steps_per_episode: 1000
    
    # DQN parameters
    hidden_dim: 256
    learning_rate: 0.0001
    batch_size: 64
    gamma: 0.98              # Discount factor
    epsilon_start: 1.0       # Starting exploration rate
    epsilon_end: 0.05        # Minimum exploration rate
    epsilon_decay: 0.99     # Decay rate for exploration
    
    # Speed profile parameters
    max_speed: 3.0
    min_speed: 0.0
    straight_speed: 3.0
    corner_speed: 1.2
    straight_distance: 6.0
    corner_distance: 2.0
    curvature_threshold: 0.2
    speed_limit_buffer: 0.2
    speed_sigma: 0.8
    overspeed_tolerance: 0.2
    overspeed_penalty_weight: -1.5

    # Reward components weights
    collision_threshold: 0.3
    collision_penalty: -100.0
    speed_reward_weight: 1.0
    progress_reward_weight: 4.0
    steering_change_penalty_weight: -0.4
    steering_accel_penalty_weight: -0.2
    centerline_reward_weight: 1.0
    centerline_sigma: 6.0
    centerline_change_penalty_weight: -0.3
    obstacle_distance_reward_weight: 0.2
    obstacle_distance_cap: 1.0

    # Lidar processing
    max_lidar_range: 10.0
    scan_window: 5

    # Car starting position
    start_x: 0.0
    start_y: 0.0
    start_yaw: 0.0
